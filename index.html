<style>
  :root { --sky:#7EC8E3; --soft:#E8F6FB; --blue:#2F80ED; --navy:#1B3A4B; --muted:#667884; --line:#e4eef3; --bg:#f4f8fb; --wa:#1ebe5d; --gold:#e6a31a; }
  * { box-sizing:border-box; } html,body { margin:0; height:100%; }
  body { background:#d7e4ec; color:var(--navy); font-family:"Noto Sans Thai","Noto Sans Lao","Noto Sans SC",sans-serif; }
  button,input,select,textarea { font-family:inherit; } button { cursor:pointer; }
  .app { width:min(430px,100%); min-height:100%; margin:0 auto; background:var(--bg); position:relative; }
  .top { position:sticky; top:0; z-index:4; display:flex; align-items:center; gap:8px; padding:12px 14px 8px; background:linear-gradient(#d7f1f8,var(--bg)); }
  .logo { width:44px; height:44px; border-radius:13px; object-fit:cover; background:#fff; }

  .grow { flex:1; }
  .lang { display:flex; background:#fff; border:1px solid var(--line); border-radius:999px; padding:2px; }
  .lang button { border:0; background:transparent; color:var(--muted); font-size:11px; font-weight:800; border-radius:999px; padding:5px 7px; }
  .lang button.on { background:var(--blue); color:#fff; }
  .body { padding:4px 14px 112px; }
  .hero { background:#fff; border-radius:26px; text-align:center; padding:22px 16px 16px; box-shadow:0 10px 28px rgba(27,58,75,.06); }
  .hero img { width:132px; border-radius:28px; }
  .hero h1 { margin:8px 0 2px; font-size:30px; }
  .search { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:11px 12px; margin-top:10px; }
  .search input,.box input,.box select,.box textarea { width:100%; border:0; outline:0; background:transparent; font-size:15px; color:var(--navy); }
  .rowchips { display:flex; gap:8px; overflow:auto; padding:10px 0 2px; }
  .chip { border:1px solid var(--line); background:#fff; color:var(--navy); border-radius:999px; padding:7px 12px; font-weight:700; font-size:13px; white-space:nowrap; }
  .chip.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .card { display:grid; grid-template-columns:116px 1fr; background:#fff; border-radius:18px; overflow:hidden; margin:10px 0; box-shadow:0 8px 22px rgba(27,58,75,.07); text-align:left; width:100%; border:0; padding:0; }
  .ph { min-height:124px; position:relative; }
  .bdg { position:absolute; left:7px; top:7px; border-radius:999px; padding:3px 7px; font-size:10px; font-weight:800; color:#fff; background:var(--blue); }
  .bdg.gold { background:var(--gold); color:var(--navy); } .bdg.ok { background:#1f9d55; top:28px; }
  .mt { padding:9px 10px 11px; } .mt h3 { margin:0 0 3px; font-size:14px; } .sub { color:var(--muted); font-size:12px; }
  .price { color:var(--blue); font-weight:800; margin-top:5px; }
  .tabs { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:min(430px,100%); background:#fff; display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--line); padding:7px 0 calc(8px + env(safe-area-inset-bottom)); z-index:5; }
  .tabs button { border:0; background:transparent; color:var(--muted); font-size:10px; font-weight:700; }
  .tabs button.on { color:var(--blue); }
  .btn { width:100%; border:0; border-radius:14px; background:var(--blue); color:#fff; font-weight:800; padding:13px; margin-top:8px; font-size:15px; }
  .btn.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); } .btn.wa { background:var(--wa); }
  .sheet { background:#fff; border-radius:18px; padding:14px; margin-top:10px; box-shadow:0 8px 22px rgba(27,58,75,.06); }
  .line { display:flex; justify-content:space-between; gap:8px; padding:7px 0; font-size:14px; }
  .roles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .role { background:#fff; border:1.5px solid var(--line); border-radius:18px; padding:16px 8px; }
  .role.on { border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,128,237,.15); }
  .back { border:0; background:#fff; width:36px; height:36px; border-radius:50%; }
  .map { height:290px; border-radius:18px; position:relative; background:linear-gradient(#d5f0f7,#d5e4c4); overflow:hidden; }
  .pin { position:absolute; transform:translate(-50%,-100%); background:var(--navy); color:#fff; border:0; border-radius:9px; font-size:10px; font-weight:800; padding:4px 6px; }
  .bubble { background:#fff; border-radius:14px; padding:8px 10px; margin:8px 0; max-width:82%; } .bubble.me { margin-left:auto; background:#d9ecff; }
  .tour { height:150px; border-radius:16px; margin-top:8px; display:grid; place-items:center; color:#fff; font-weight:800; }
  .note { color:var(--muted); font-size:12px; text-align:center; }
  .toast { position:fixed; z-index:9; left:50%; transform:translateX(-50%); bottom:92px; width:min(380px,calc(100% - 24px)); background:var(--navy); color:#fff; text-align:center; border-radius:999px; padding:10px 14px; font-size:13px; }
  .box { background:#fff; border:1px solid var(--line); border-radius:12px; padding:11px; margin:8px 0; }
</style>

function chips() {

function bindList() {

  shell(`<div class="hero"><img src="logo.jpg" alt="SD House"/><h1>SD House</h1><p>${t("tag")}</p></div><h2 style="text-align:center">${t("choose")}</h2><div class="box"><input id="phone" placeholder="${t("phone")}" value="${S.phone || ""}"/></div><div class="roles"><button class="role ${S.pick==="buyer"?"on":""}" data-pick="buyer"><b>${t("buyer")}</b><div class="sub">${t("buyerSub")}</div></button><button class="role ${S.pick==="seller"?"on":""}" data-pick="seller"><b>${t("seller")}</b><div class="sub">${t("sellerSub")}</div></button></div><button class="btn" id="go">${t("next")}</button><p class="note">${t("demo")}</p>`, false);
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { S.pick = b.dataset.pick; render(); });
  document.getElementById("go").onclick = () => { S.phone = document.getElementById("phone").value || "020"; S.role = S.pick || "buyer"; S.tab = "home"; save(); render(); };
}
function home() {
  const rows = list();
  shell(`<div class="search">⌕ <input id="q" value="${S.q}" placeholder="${t("search")}"/></div><button class="chip" id="near">${t("near")}</button>${chips()}<h2>${rows.length} ${t("count")}</h2>${rows.map(card).join("") || `<p class="note">${t("empty")}</p>`}`, true);
  bindList();
  document.getElementById("near").onclick = () => { S.zone = "chantha"; S.tab = "map"; save(); toast(t("near")); render(); };
}
function map() {
  const rows = list();
  shell(`<div class="search">⌕ <input id="q" value="${S.q}" placeholder="${t("map")}"/></div>${chips()}<div class="map">${rows.map(x => `<button class="pin" style="left:${x.x}%;top:${x.y}%" data-open="${x.id}">${x.id.slice(-3)}</button>`).join("")}</div><p class="note">${rows.length} ${t("count")}</p>${rows.slice(0,2).map(card).join("")}`, true);
  bindList();
}
function detail() {
  const x = S.listings.find(i => i.id === S.openId);
  if (!x) { S.screen = "list"; return render(); }
  shell(`<button class="back" id="back">←</button><div class="ph" style="height:200px;border-radius:18px;margin-top:8px;background:${bg(x)}"></div><div class="tour" style="background:${bg(x)}">360°</div><div class="sheet"><h2 style="margin:0">${tx(x.title)} ${x.verified ? "✓" : ""}</h2><div class="price">${money(x.price)}</div><div class="line"><span>${t("size")}</span><b>${x.size} m²</b></div><div class="line"><span>${t("front")}</span><b>${x.front} m</b></div><div class="line"><span>${t("doc")}</span><b>${x.verified ? t("verified") : t("wait")}</b></div><a class="btn wa" target="_blank" href="${wa(x)}">${t("ask")}</a><button class="btn ghost" id="fav">${S.saved.includes(x.id) ? "★" : "☆"} ${t("saved")}</button><button class="btn" id="chat">${t("chat")}</button><button class="btn ghost" id="cmp">${t("cmp")}</button><button class="btn ghost" id="book">${t("book")}</button><h3>${t("rev")}</h3>${x.reviews.map(r => `<div class="bubble"><b>${r.by}</b><div>${tx(r.text)}</div></div>`).join("") || `<p class="note">${t("empty")}</p>`}<button class="btn ghost" id="rev">+ ${t("rev")}</button></div>`, false);
  document.getElementById("back").onclick = () => { S.screen = "list"; save(); render(); };
  document.getElementById("fav").onclick = () => { S.saved = S.saved.includes(x.id) ? S.saved.filter(id => id !== x.id) : S.saved.concat(x.id); save(); render(); };
  document.getElementById("chat").onclick = () => { S.screen = "chat"; save(); render(); };
  document.getElementById("cmp").onclick = () => { if (!S.compare.includes(x.id)) S.compare.push(x.id); S.compare = S.compare.slice(-2); S.screen = "compare"; save(); render(); };
  document.getElementById("book").onclick = () => toast(t("book"));
  document.getElementById("rev").onclick = () => { x.reviews.push({by:"คุณ", text:{th:"ดูแล้ว สนใจ",lao:"ເບິ່ງແລ້ວ",zh:"已查看",en:"Viewed"}}); save(); render(); };
}
function chat() {
  const x = S.listings.find(i => i.id === S.openId);
  const msgs = S.chat[x.id] || [{from:"owner", text:t("ask") + " " + x.id}];
  shell(`<button class="back" id="back">←</button><h2>${t("chat")}</h2><p class="note">${tx(x.title)}</p>${msgs.map(m => `<div class="bubble ${m.from==="me"?"me":""}">${m.text}</div>`).join("")}<div class="box"><input id="msg" placeholder="${t("send")}"/></div><button class="btn" id="send">${t("send")}</button><button class="btn ghost" id="pic">${t("pic")}</button><a class="btn wa" target="_blank" href="${wa(x)}">${t("ask")}</a>`, false);
  document.getElementById("back").onclick = () => { S.screen = "detail"; save(); render(); };
  document.getElementById("send").onclick = () => { const v = document.getElementById("msg").value.trim(); if (!v) return; S.chat[x.id] = (S.chat[x.id] || msgs).concat([{from:"me", text:v},{from:"owner", text:"รับเรื่องแล้ว / ຮັບແລ້ວ"}]); save(); render(); };
  document.getElementById("pic").onclick = () => { S.chat[x.id] = (S.chat[x.id] || msgs).concat([{from:"me", text:"[รูป " + x.id + "]"}]); save(); render(); };
}
function compare() {
  const items = S.compare.map(id => S.listings.find(x => x.id === id)).filter(Boolean);
  shell(`<button class="back" id="back">←</button><h2>${t("cmp")}</h2>${items.map(x => `<div class="sheet"><b>${tx(x.title)}</b><div class="price">${money(x.price)}</div><div class="sub">${x.size} m² · ${t("front")} ${x.front} m · ${x.verified ? t("verified") : "-"}</div></div>`).join("") || `<p class="note">${t("empty")}</p>`}`, false);
  document.getElementById("back").onclick = () => { S.screen = "list"; save(); render(); };
}
function saved() {
  const rows = S.listings.filter(x => S.saved.includes(x.id));
  shell(`<h2>${t("saved")}</h2>${rows.map(card).join("") || `<p class="note">${t("empty")}</p>`}`, true);
  bindList();
}
function account() {
  const mine = S.listings.filter(x => x.owner === "me");
  shell(`<div class="sheet"><svg class="logo" viewBox="0 0 64 64" width="44" height="44" aria-label="SD House"><rect width="64" height="64" rx="14" fill="#7EC8E3"/><path d="M24 28h14v12H24z" fill="#fff" stroke="#1B3A4B" stroke-width="2"/><path d="M22 28l9-8 9 8" fill="none" stroke="#1B3A4B" stroke-width="2"/><path d="M12 42c8-8 14-6 18-2 4-6 12-4 20 2v6H12z" fill="#fff" stroke="#1B3A4B" stroke-width="2"/><text x="32" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#1B3A4B">SD</text></svg><h2 style="margin:8px 0 0">SD House</h2><div class="line"><span>${t("phone")}</span><b>${S.phone}</b></div><div class="line"><span></span><b>${S.role === "seller" ? t("seller") : t("buyer")}</b></div><button class="btn" id="sw">${S.role === "seller" ? t("buyer") : t("seller")}</button>${S.role === "seller" ? `<button class="btn ghost" id="add">${t("add")}</button>` : ""}<button class="btn ghost" id="ad">${t("admin")}: ${S.admin ? "ON" : "OFF"}</button><button class="btn ghost" id="rs">${t("reset")}</button><p class="note">${t("demo")}</p></div>${mine.map(x => `<div class="sheet"><b>${tx(x.title)}</b><div class="sub">${x.status === "live" ? t("live") : t("wait")} · ${x.id}</div>${S.admin && x.status !== "live" ? `<button class="btn" data-ok="${x.id}">${t("ok")}</button>` : ""}<button class="btn ghost" data-pro="${x.id}">${t("pro")}</button></div>`).join("")}`, true);
  document.getElementById("sw").onclick = () => { S.role = S.role === "seller" ? "buyer" : "seller"; save(); render(); };
  const addBtn = document.getElementById("add");
  if (addBtn) addBtn.onclick = () => { S.screen = "add"; save(); render(); };
  document.getElementById("ad").onclick = () => { S.admin = !S.admin; save(); render(); };
  document.getElementById("rs").onclick = () => { localStorage.removeItem("sdhouse"); location.reload(); };
  document.querySelectorAll("[data-ok]").forEach(b => b.onclick = () => { S.listings.find(x => x.id === b.dataset.ok).status = "live"; save(); toast(t("live")); render(); });
  document.querySelectorAll("[data-pro]").forEach(b => b.onclick = () => { const x = S.listings.find(i => i.id === b.dataset.pro); x.promo = "featured"; x.promoUntil = Date.now() + 864e5 * 30; x.status = "live"; x.updated = Date.now(); save(); toast(t("paid")); S.tab = "home"; S.screen = "list"; render(); });
}
function add() {
  shell(`<button class="back" id="back">←</button><h2>${t("add")}</h2><div class="box"><input id="title" placeholder="${t("house")}"/></div><div class="box"><input id="price" type="number" placeholder="LAK"/></div><div class="box"><select id="type"><option value="land">${t("land")}</option><option value="house">${t("house")}</option></select></div><button class="btn" id="save">${t("add")}</button><p class="note">${t("wait")}</p>`, false);
  document.getElementById("back").onclick = () => { S.screen = "list"; S.tab = "me"; save(); render(); };
  document.getElementById("save").onclick = () => {
    const title = document.getElementById("title").value.trim();
    const price = Number(document.getElementById("price").value);
    if (!title || !price) return toast(t("need"));
    S.listings.unshift({id:"SD-" + (1000 + S.listings.length), type:document.getElementById("type").value, zone:"chantha", owner:"me", title:{th:title,lao:title,zh:title,en:title}, district:{th:"เวียงจันทน์",lao:"ວຽງຈັນ",zh:"万象",en:"Vientiane"}, price, size:500, front:8, pet:false, stay:"sale", lux:false, verified:false, hue:"#9bb7c9", x:50, y:52, status:"pending", promo:"", promoUntil:0, updated:Date.now(), reviews:[]});
    S.screen = "list"; S.tab = "me"; save(); toast(t("wait")); render();
  };
}
render();
</script>
</body>
</html>
