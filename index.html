<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1B6FD4"/>
<title>SD House</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root { --blue:#1B6FD4; --sky:#7EC8E3; --navy:#1B3A4B; --pink:#e25b6a; --bg:#f6f7f9; --muted:#70808c; }
  * { box-sizing:border-box; } body { margin:0; background:#e8eef3; font-family:"Noto Sans Thai","Noto Sans Lao",sans-serif; color:var(--navy); }
  button,input { font-family:inherit; } button { cursor:pointer; }
  .app { width:min(430px,100%); min-height:100vh; margin:0 auto; background:var(--bg); padding-bottom:96px; }
  .head { background:linear-gradient(#1B6FD4,#2F80ED); color:#fff; padding:14px 14px 18px; border-radius:0 0 22px 22px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:800; }
  .mark { width:36px; height:36px; border-radius:10px; background:#7EC8E3; display:grid; place-items:center; }
  .search { margin-top:12px; background:#fff; border-radius:999px; display:flex; align-items:center; gap:8px; padding:11px 14px; color:#8aa; }
  .search input { border:0; outline:0; width:100%; font-size:15px; color:var(--navy); }
  .prices { display:grid; grid-template-columns:repeat(3,1fr); background:#fff; margin:-12px 14px 0; border-radius:16px; position:relative; box-shadow:0 8px 18px rgba(27,58,75,.06); }
  .prices button { border:0; background:transparent; padding:12px 6px; }
  .prices b { display:block; font-size:16px; } .prices span { color:var(--muted); font-size:11px; }
  .promo { margin:14px; background:linear-gradient(#fff,#f3f8ff); border-radius:16px; padding:14px; display:flex; align-items:center; gap:10px; }
  .promo i { width:36px; height:36px; border-radius:50%; background:#e8f3ff; display:grid; place-items:center; font-style:normal; }
  .hscroll { display:flex; gap:10px; overflow:auto; padding:0 14px 6px; }
  .pcard { min-width:168px; background:transparent; border:0; text-align:left; padding:0; }
  .photo { height:118px; border-radius:14px; position:relative; }
  .time { position:absolute; left:8px; top:8px; background:#fff; border-radius:999px; font-size:11px; font-weight:700; padding:3px 7px; }
  .name { font-weight:800; margin:6px 0 0; font-size:13px; }
  .sub { color:var(--muted); font-size:12px; }
  .price { color:var(--blue); font-weight:800; } .old { color:#a0aab2; text-decoration:line-through; font-weight:600; font-size:12px; }
  .off { color:var(--pink); font-weight:800; font-size:12px; }
  h2 { font-size:16px; margin:16px 14px 8px; }
  .wide { min-width:250px; }
  .wide .photo { height:150px; }
  .heart { position:absolute; right:8px; top:8px; background:#fff; border:0; border-radius:50%; width:30px; height:30px; }
  .deal { position:fixed; left:50%; transform:translateX(-50%); bottom:78px; width:min(400px,calc(100% - 24px)); background:#fff5f6; border-radius:16px; padding:10px 12px; display:flex; align-items:center; gap:8px; box-shadow:0 8px 20px rgba(27,58,75,.12); z-index:6; }
  .timer { margin-left:auto; background:var(--pink); color:#fff; border-radius:8px; padding:6px 8px; font-weight:800; }
  .x { border:0; background:transparent; font-size:18px; }
  .tabs { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:min(430px,100%); background:#fff; display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid #edf1f4; padding:8px 0 calc(8px + env(safe-area-inset-bottom)); z-index:7; }
  .tabs button { border:0; background:transparent; color:#8b98a2; font-size:11px; font-weight:700; }
  .tabs button.on { color:var(--blue); }
  .sheet { background:#fff; margin:12px 14px; border-radius:16px; padding:12px; }
  .btn { width:100%; border:0; background:var(--blue); color:#fff; border-radius:12px; padding:12px; font-weight:800; margin-top:8px; }
  .hide { display:none; }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="brand"><div class="mark">🐘</div><div>SD House<div style="font-size:11px;font-weight:600;opacity:.85">บ้านและที่ดิน เวียงจันทน์</div></div></div>
    <div class="search">⌕ <input id="q" placeholder="ค้นหาบ้าน ที่ดิน เมือง"/></div>
  </div>
  <div class="prices">
    <button data-max="500000000"><b>₭ 500,000</b><span>ที่ดินงบเริ่ม</span></button>
    <button data-max="1500000000"><b>₭ 1,500,000</b><span>บ้านงบกลาง</span></button>
    <button data-max="3000000000"><b>₭ 3,000,000</b><span>แปลงใหญ่</span></button>
  </div>
  <div class="promo"><i>%</i><div><b>ประกาศแนะนำ ลดค่าโปรโมต 30%</b><div class="sub">ดันประกาศให้ค้นเจอง่าย 7 วัน</div></div></div>
  <div class="hscroll" id="row"></div>
  <h2>แนะนำสำหรับคุณ</h2>
  <div class="hscroll" id="wide"></div>
  <div id="list"></div>
  <div class="deal" id="deal"><span>⏱</span><div><b>โปรโมตด่วน 25%</b><div class="sub">ใช้ก่อนหมดเวลา</div></div><div class="timer" id="timer">14:59</div><button class="x" id="closedeal">×</button></div>
  <nav class="tabs">
    <button class="on" data-tab="home">หน้าแรก</button>
    <button data-tab="list">ประกาศ</button>
    <button data-tab="search">ค้นหา</button>
    <button data-tab="saved">บันทึก <span id="badge"></span></button>
    <button data-tab="me">บัญชี</button>
  </nav>
</div>
<script>
const items = [
  {id:"SD-421", title:"ที่ดินหนองไผ่", sub:"ศรีสัทนา", price:1200000000, old:1500000000, off:"แนะนำ", score:"94%", hue:"#d7a36a", mins:"ดูได้วันนี้", big:true},
  {id:"SD-488", title:"ที่ดินดอนหนูน", sub:"หาดซายฟอง", price:1800000000, old:2100000000, off:"ลด 10%", score:"93%", hue:"#c9844a", mins:"10-25 นาที", big:true},
  {id:"SD-312", title:"สวนสีไค", sub:"จันทะบุรี", price:750000000, old:890000000, off:"ลด 15%", score:"82%", hue:"#8eaa62", mins:"นัดดูที่", big:false},
  {id:"SD-502", title:"บ้านดอนกอย", sub:"สีโคดตะบอง", price:2100000000, old:2400000000, off:"ยืนยันแล้ว", score:"91%", hue:"#7ea0b8", mins:"บ้าน 2 ชั้น", big:true},
  {id:"SD-277", title:"บ้านนาไซทอง", sub:"ระยะสั้น", price:9000000, old:12000000, off:"เช่ารายเดือน", score:"88%", hue:"#b7c36a", mins:"เข้าอยู่ได้", big:false}
];
let saved = JSON.parse(localStorage.getItem("sdh-saved")||"[]");
let max = 0, q = "", tab = "home";
const kip = n => "₭" + Math.round(n/1000).toLocaleString("en-US");
function card(x, wide){
  return `<button class="pcard ${wide?"wide":""}" data-id="${x.id}"><div class="photo" style="background:linear-gradient(145deg,${x.hue},#f4efe4)"><span class="time">${x.mins}</span><button class="heart" data-save="${x.id}">${saved.includes(x.id)?"♥":"♡"}</button></div><div class="name">SD House · ${x.id}</div><div class="sub">${x.title} · ${x.sub}</div><div class="price">${kip(x.price)} <span class="old">${kip(x.old)}</span></div><div class="off">${x.off}</div><div class="sub">👍 ${x.score}</div></button>`;
}
function draw(){
  const rows = items.filter(x => (!q || (x.title+x.sub+x.id).includes(q)) && (!max || x.price<=max*1000));
  document.getElementById("row").innerHTML = rows.map(x=>card(x,false)).join("");
  document.getElementById("wide").innerHTML = rows.filter(x=>x.big).map(x=>card(x,true)).join("");
  document.getElementById("list").innerHTML = tab==="saved" ? `<h2>บันทึกไว้</h2>`+rows.filter(x=>saved.includes(x.id)).map(x=>`<div class="sheet"><b>${x.title}</b><div>${kip(x.price)}</div><a class="btn" style="display:block;text-align:center;text-decoration:none" href="https://wa.me/8562091001122?text=SD%20House%20${x.id}">ทัก WhatsApp</a></div>`).join("") : tab==="me" ? `<div class="sheet"><b>SD House</b><div class="sub">ผู้ซื้อ / ผู้ขาย สลับได้</div><button class="btn" id="role">ลงประกาศฝากขาย</button></div>` : "";
  document.getElementById("badge").textContent = saved.length? saved.length : "";
  document.querySelectorAll("[data-id]").forEach(b=>b.onclick=ev=>{ if(ev.target.dataset.save) return; location.href="https://wa.me/8562091001122?text="+encodeURIComponent("SD House "+b.dataset.id); });
  document.querySelectorAll("[data-save]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); const id=b.dataset.save; saved=saved.includes(id)?saved.filter(i=>i!==id):saved.concat(id); localStorage.setItem("sdh-saved",JSON.stringify(saved)); draw(); });
  const role=document.getElementById("role"); if(role) role.onclick=()=>alert("โหมดผู้ขาย: อัปโหลดรูป ที่ ราคา แล้วรอแอดมินอนุมัติ");
}
document.getElementById("q").oninput=e=>{ q=e.target.value.trim(); draw(); };
document.querySelectorAll("[data-max]").forEach(b=>b.onclick=()=>{ max=Number(b.dataset.max); draw(); });
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("on")); b.classList.add("on"); draw(); });
document.getElementById("closedeal").onclick=()=>document.getElementById("deal").classList.add("hide");
let sec=14*60+59; setInterval(()=>{ sec=Math.max(0,sec-1); const m=String(Math.floor(sec/60)).padStart(2,"0"); const s=String(sec%60).padStart(2,"0"); document.getElementById("timer").textContent=m+":"+s; },1000);
draw();
</script>
</body>
</html>
